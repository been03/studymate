<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">게시글 수정</h1>

    <form th:action="@{/api/board/{id}(id=${board.id})}" method="post">

        <input type="hidden" name="_method" value="put">

        <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            <input type="text" class="form-control" id="title" name="title" th:value="${board.title}" required>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea class="form-control" id="content" name="content" rows="10" required th:text="${board.content}"></textarea>
        </div>

        <button type="submit" class="btn btn-warning">수정 완료</button>
        <a th:href="@{/board/{id}(id=${board.id})}" class="btn btn-secondary">취소</a>
    </form>
</div>
</body>
</html>
