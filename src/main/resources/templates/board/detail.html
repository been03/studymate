<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <title th:text="${board.title}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4" th:text="${board.title}">게시글 제목</h1>

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between">
            <span th:text="|작성자: ${board.authorEmail}|">작성자: author@email.com</span>
            <span th:text="|작성일: ${#temporals.format(board.createdAt, 'yyyy-MM-dd HH:mm')}|">작성일: 2023-01-01</span>
        </div>
        <div class="card-body">
            <p class="card-text" style="white-space: pre-wrap;" th:text="${board.content}">게시글 내용</p>
        </div>
    </div>

    <div class="d-flex justify-content-between">
        <a th:href="@{/}" class="btn btn-secondary">목록</a>

        <div sec:authorize="isAuthenticated()">
            <th:block th:if="${board.authorEmail == #authentication.name}">

                <a th:href="@{/board/edit/{id}(id=${board.id})}" class="btn btn-warning me-2">수정</a>

                <form th:action="@{/api/board/{id}(id=${board.id})}" method="post" style="display: inline;"
                      onsubmit="return confirm('정말로 이 게시글을 삭제하시겠습니까?');">

                    <input type="hidden" name="_method" value="delete">

                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>
            </th:block>
        </div>
    </div>

</div>
</body>
</html>
