<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>스터디메이트 게시판</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">스터디메이트 게시판</h1>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div sec:authorize="isAuthenticated()">
            <span class="badge bg-primary">환영합니다!
                <span sec:authentication="name">사용자 이메일</span>
            </span>
            <a class="btn btn-sm btn-outline-danger ms-3" onclick="document.getElementById('logout-form').submit();">로그아웃</a>

            <form id="logout-form" th:action="@{/logout}" method="post" style="display: none;"></form>

            <a th:href="@{/board/write}" class="btn btn-sm btn-success ms-2">새 글 작성</a>
        </div>

        <div sec:authorize="isAnonymous()">
            <a th:href="@{/login}" class="btn btn-sm btn-primary">로그인</a>
            <a th:href="@{/user}" class="btn btn-sm btn-secondary">회원가입</a>
        </div>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="board : ${boards}">
            <td th:text="${board.id}">1</td>
            <td>
                <a th:href="@{/board/{id}(id=${board.id})}" th:text="${board.title}">테스트 제목입니다.</a>
            </td>
            <td th:text="${board.authorEmail}">test@example.com</td>
            <td th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd HH:mm')}">2023-11-24 10:00</td>
        </tr>
        </tbody>
    </table>

    <div th:if="${boards.totalPages > 0}" class="d-flex justify-content-center">
        <nav>
            <ul class="pagination">
                <li class="page-item" th:classappend="${boards.number == 0 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/(page=${boards.number - 1})}">이전</a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(0, boards.totalPages - 1)}"
                    th:classappend="${i == boards.number ? 'active' : ''}">
                    <a class="page-link" th:href="@{/(page=${i})}" th:text="${i + 1}">1</a>
                </li>

                <li class="page-item" th:classappend="${boards.number == boards.totalPages - 1 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/(page=${boards.number + 1})}">다음</a>
                </li>
            </ul>
        </nav>
    </div>

    <div th:if="${boards.isEmpty()}" class="alert alert-info text-center">
        등록된 게시글이 없습니다.
    </div>

</div>
</body>
</html>
