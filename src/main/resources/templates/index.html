<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>스터디메이트 게시판</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">
        <a th:href="@{/}" class="text-decoration-none text-dark">스터디메이트 게시판</a>
    </h1>

    <div class="row mb-4 align-items-center">

        <!-- 좌측: 인증 상태 및 글쓰기 버튼 -->
        <div class="col-md-5 d-flex align-items-center justify-content-start">
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center me-2">
                <span class="badge bg-secondary me-2"
                      th:text="|환영합니다! ${#authentication.name}|">환영합니다! user@test.com</span>
                <a th:href="@{/logout}" class="btn btn-outline-secondary btn-sm me-2">로그아웃</a>
            </div>

            <div sec:authorize="!isAuthenticated()" class="d-flex align-items-center me-2">
                <a th:href="@{/login}" class="btn btn-outline-danger btn-sm me-2">로그인</a>
            </div>

            <a th:href="@{/board/write}" class="btn btn-outline-primary btn-sm">글쓰기</a>
        </div>

        <!-- 우측: ⭐️ 조건 드롭다운이 추가된 검색 폼 -->
        <div class="col-md-7 d-flex justify-content-end">
            <form action="/" method="get" class="d-flex align-items-center" style="max-width: 420px; width: 100%;">

                <!-- 검색 조건 드롭다운 (선택 상태 유지: th:selected) -->
                <select name="searchType" class="form-select form-select-sm me-2" style="width: 130px;">
                    <option value="titleOrContent" th:selected="${searchType == 'titleOrContent'}">제목+내용</option>
                    <option value="title" th:selected="${searchType == 'title'}">제목</option>
                    <option value="content" th:selected="${searchType == 'content'}">내용</option>
                </select>

                <!-- 검색어 입력창 -->
                <input type="text"
                       name="searchKeyword"
                       class="form-control form-control-sm me-2"
                       placeholder="검색어를 입력하세요"
                       th:value="${searchKeyword}">

                <button type="submit" class="btn btn-outline-success btn-sm text-nowrap">검색</button>
            </form>
        </div>
    </div>

    <!-- 게시글 테이블 -->
    <table class="table table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="board : ${boards.content}">
            <td th:text="${board.id}">1</td>
            <td>
                <!-- ⭐️ searchType도 링크 파라미터로 함께 전달 -->
                <a th:href="@{/board/{id}(id=${board.id}, page=${boards.number}, searchType=${searchType}, searchKeyword=${searchKeyword})}"
                   th:text="${board.title}">게시글 제목</a>
            </td>
            <td th:text="${board.authorEmail}">author@email.com</td>
            <td th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd HH:mm')}">2023-01-01 10:00</td>
        </tr>
        </tbody>
    </table>

    <!-- ⭐️ 페이징 영역 (searchType 조건 유지) -->
    <div class="d-flex justify-content-center mt-4">
        <a th:href="@{/(page=${boards.number - 1}, size=${boards.size}, searchType=${searchType}, searchKeyword=${searchKeyword})}"
           th:classappend="${boards.first} ? 'disabled'"
           class="btn btn-light border btn-sm me-1">이전</a>

        <th:block th:with="start=${(boards.number/5)*5}, end=${(start + 4 < boards.totalPages) ? start + 4 : boards.totalPages - 1}">
            <a th:each="page : ${#numbers.sequence(start, end)}"
               th:href="@{/(page=${page}, searchType=${searchType}, searchKeyword=${searchKeyword})}"
               th:text="${page + 1}"
               th:classappend="${page == boards.number} ? 'btn-primary' : 'btn-light border'"
               class="btn btn-sm me-1"></a>
        </th:block>

        <a th:href="@{/(page=${boards.number + 1}, size=${boards.size}, searchType=${searchType}, searchKeyword=${searchKeyword})}"
           th:classappend="${boards.last} ? 'disabled'"
           class="btn btn-light border btn-sm">다음</a>
    </div>

    <div th:if="${boards.isEmpty()}" class="alert alert-info text-center mt-3">
        등록된 게시글이 없습니다.
    </div>

</div>
</body>
</html>
