<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>StudyMate - 오류 안내</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-5 text-center shadow-sm" style="max-width: 500px; width: 100%;">
        <div class="mb-3">
            <h1 class="display-4 text-warning fw-bold">⚠️</h1>
        </div>
        <h3 class="fw-bold mb-3">안내</h3>

        <!-- 컨트롤러/예외 핸들러에서 전달받은 메시지 출력 -->
        <p class="text-secondary mb-4" th:text="${errorMessage}">요청을 처리하는 중 오류가 발생했습니다.</p>

        <div class="d-flex justify-content-center gap-2">
            <a href="javascript:history.back()" class="btn btn-outline-secondary">이전 페이지</a>
            <a th:href="@{/}" class="btn btn-primary">홈으로 이동</a>
        </div>
    </div>
</div>
</body>
</html>
