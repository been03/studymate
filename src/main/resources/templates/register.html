<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">

        <!-- 서비스 로고 -->
        <div class="text-center mb-3">
            <a th:href="@{/}" class="text-decoration-none text-dark fs-2 fw-bold">
                StudyMate
            </a>
        </div>

        <h4 class="text-center text-secondary mb-4">회원가입</h4>

        <!-- 중복 이메일 등 비즈니스 예외 알림 -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert" th:text="${errorMessage}">
        </div>

        <!-- 회원가입 폼: th:object 설정 -->
        <form th:action="@{/register}" th:object="${userJoinRequest}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">이메일</label>
                <input type="text" class="form-control" id="email" th:field="*{email}" placeholder="name@example.com">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label for="nickname" class="form-label">닉네임</label>
                <input type="text" class="form-control" id="nickname" th:field="*{nickname}" placeholder="별명 또는 이름">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" class="form-control" id="password" th:field="*{password}">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">가입완료</button>

            <div class="d-flex justify-content-between">
                <a th:href="@{/login}" class="text-decoration-none text-secondary small">이미 계정이 있으신가요? 로그인</a>
                <a th:href="@{/}" class="text-decoration-none text-secondary small">메인으로 이동</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
