<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">

        <!-- ⭐️ 1. 상단 서비스 로고 (메인 이동 링크) -->
        <div class="text-center mb-3">
            <a th:href="@{/}" class="text-decoration-none text-dark fs-2 fw-bold">
                StudyMate
            </a>
        </div>

        <h4 class="text-center text-secondary mb-4">로그인</h4>

        <!-- 로그인 실패 알림 -->
        <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
            이메일 또는 비밀번호가 올바르지 않습니다.
        </div>

        <!-- 2. 로그인 폼 -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">이메일</label>
                <!-- SecurityConfig의 .usernameParameter("email") 매핑 유지 -->
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">로그인</button>

            <!-- ⭐️ 3. 하단 탈출 및 회원가입 보조 링크 -->
            <div class="d-flex justify-content-between">
                <a th:href="@{/register}" class="text-decoration-none text-secondary small">회원가입</a>
                <a th:href="@{/}" class="text-decoration-none text-secondary small">메인으로 이동</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
